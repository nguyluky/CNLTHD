services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: PRODUCTION
      APP_NAME: ${APP_NAME:-CNLTHD API}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/cnlthd
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cnlthd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cnlthd"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
